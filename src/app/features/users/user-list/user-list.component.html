<div class="p-6 w-full">
  <div class="bg-branco-puro rounded-2xl shadow-sm border border-cinza-contorno p-6">
    
    <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-6 gap-4">
      <div>
        <h2 class="text-2xl font-bold text-azul-prisma">Gestão de Usuários</h2>
        <p class="text-cinza-medio text-sm">Gerencie os acessos e status dos colaboradores.</p>
      </div>

      <button routerLink="/users/new"
        class="bg-azul-prisma hover:bg-blue-800 text-branco-puro px-5 py-2.5 rounded-lg font-medium transition-colors flex items-center gap-2 cursor-pointer shadow-sm">
        <i class="pi pi-plus"></i>
        Novo Usuário
      </button>
    </div>

    <div class="flex items-center gap-4 mb-6 bg-fundo-offwhite p-5 rounded-xl border border-cinza-contorno w-full md:w-auto mt-4">
      
      <p-floatlabel class="w-full md:w-96">
        <input 
          id="pesquisa"
          type="text" 
          pInputText 
          [(ngModel)]="searchQuery" 
          (keydown.enter)="onSearch()"
          class="w-full border-cinza-contorno text-cinza-chumbo focus:border-verde-teal focus:ring-verde-teal text-lg py-3"
        />
        <label for="pesquisa" class="text-cinza-medio text-lg">Pesquisar por nome...</label>
      </p-floatlabel>
      
      <button 
        (click)="onSearch()" 
        class="border border-verde-teal text-verde-teal hover:bg-verde-teal hover:text-branco-puro px-6 py-3 rounded-lg text-lg font-medium transition-colors flex items-center gap-2 cursor-pointer bg-branco-puro">
        <i class="pi pi-search text-lg"></i>
        Pesquisar
      </button>
    </div>

    <div class="border border-cinza-contorno rounded-xl overflow-hidden aja-table-wrapper">
      <p-table 
        [value]="users()" 
        [lazy]="true" 
        (onLazyLoad)="loadUsers($event)" 
        dataKey="id" 
        [paginator]="true" 
        [rows]="10" 
        [totalRecords]="totalRecords()" 
        [rowsPerPageOptions]="[10, 25, 50]" 
        [loading]="isLoading()" 
        [rowHover]="true"
        styleClass="p-datatable-sm w-full"
        responsiveLayout="scroll">
        
        <ng-template pTemplate="header">
          <tr>
            <th class="bg-fundo-offwhite text-cinza-chumbo border-b border-cinza-contorno p-4 font-semibold text-left w-[10%]">ID</th>
            <th class="bg-fundo-offwhite text-cinza-chumbo border-b border-cinza-contorno p-4 font-semibold text-left w-[30%]">Nome</th>
            <th class="bg-fundo-offwhite text-cinza-chumbo border-b border-cinza-contorno p-4 font-semibold text-left w-[20%]">Login</th>
            <th class="bg-fundo-offwhite text-cinza-chumbo border-b border-cinza-contorno p-4 font-semibold text-left w-[20%]">Telefone</th>
            <th class="bg-fundo-offwhite text-cinza-chumbo border-b border-cinza-contorno p-4 font-semibold text-left w-[20%]">Status</th>
            <th class="bg-fundo-offwhite text-cinza-chumbo border-b border-cinza-contorno p-4 font-semibold text-center w-[10%]">Ações</th>
          </tr>
        </ng-template>

        <ng-template pTemplate="body" let-user>
          <tr class="bg-branco-puro border-b border-cinza-contorno hover:bg-fundo-offwhite transition-colors"
              [ngClass]="{'text-vermelho-alerta font-medium': !user.active, 'text-cinza-chumbo': user.active}">
            <td class="p-4">{{ user.id }}</td>
            <td class="p-4">{{ user.name }}</td>
            <td class="p-4">{{ user.login }}</td>
            <td class="p-4">{{ user.phone || 'Não informado' }}</td>
            <td class="p-4">
              <p-dropdown 
                [options]="statusOptions" 
                [(ngModel)]="user.active" 
                (onChange)="onStatusChange(user)" 
                optionLabel="label" 
                optionValue="value" 
                appendTo="body"
                [styleClass]="!user.active ? 'border-vermelho-alerta text-vermelho-alerta w-full' : 'border-cinza-contorno text-cinza-chumbo w-full'">
              </p-dropdown>
            </td>
            <td class="p-4 text-center">
                <button 
                    [routerLink]="['/users', user.id, 'edit']"
                    class="p-button-rounded p-button-text bg-azul-prisma/10 hover:bg-azul-prisma hover:text-branco-puro text-azul-prisma w-10 h-10 rounded-full transition-colors cursor-pointer"
                    pTooltip="Editar Usuário"
                    tooltipPosition="left">
                    <i class="pi pi-pencil"></i>
                </button>
            </td>
          </tr>
        </ng-template>

        <ng-template pTemplate="emptymessage">
          <tr>
            <td colspan="5" class="text-center p-8 text-cinza-medio bg-branco-puro">
              Nenhum usuário encontrado com os filtros atuais.
            </td>
          </tr>
        </ng-template>
        
      </p-table>
    </div>
  </div>
</div>
