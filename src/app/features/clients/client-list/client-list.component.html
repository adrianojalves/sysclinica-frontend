<div class="p-6 w-full max-w-7xl mx-auto">
  <div class="bg-branco-puro rounded-2xl shadow-md border border-cinza-contorno p-6">
    
    <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-8">
      <div>
        <h2 class="text-3xl font-bold text-azul-prisma">Clientes</h2>
        <p class="text-cinza-medio text-lg">Gerenciamento de pacientes e cadastros.</p>
      </div>
      <button routerLink="/clients/new"
        class="bg-azul-prisma hover:bg-blue-800 text-branco-puro px-6 py-3 rounded-lg font-bold transition-colors flex items-center gap-2 cursor-pointer shadow-sm text-lg">
        <i class="pi pi-user-plus font-bold"></i>
        Novo Cliente
      </button>
    </div>

    <div class="flex flex-col md:flex-row gap-4 mb-8 p-6 bg-fundo-offwhite rounded-xl border border-cinza-contorno items-end">
      <p-floatlabel class="flex-1">
        <input id="nameFilter" type="text" pInputText [(ngModel)]="filterName" (keyup.enter)="loadClients()"
          class="w-full border-2 border-cinza-contorno bg-branco-puro text-lg py-3 px-4 rounded-lg focus:border-verde-teal outline-none transition-all" />
        <label for="nameFilter" class="ml-2 text-cinza-chumbo font-medium">Pesquisar por nome...</label>
      </p-floatlabel>

      <p-floatlabel class="w-full md:w-64">
        <p-inputMask id="cpfFilter" mask="999.999.999-99" [(ngModel)]="filterCpf"
          styleClass="w-full border-2 border-cinza-contorno bg-branco-puro text-lg py-3 px-4 rounded-lg focus:border-verde-teal outline-none transition-all"></p-inputMask>
        <label for="cpfFilter" class="ml-2 text-cinza-chumbo font-medium">CPF...</label>
      </p-floatlabel>

      <button (click)="loadClients()"
        class="bg-verde-teal hover:bg-opacity-90 text-branco-puro px-8 py-3 rounded-lg font-bold transition-all flex items-center gap-2 cursor-pointer shadow-sm text-lg h-[58px]">
        <i class="pi pi-search font-bold"></i>
        Filtrar
      </button>
    </div>

    <p-table 
      [value]="clients()" 
      [lazy]="true" 
      (onLazyLoad)="loadClients($event)" 
      [paginator]="true" 
      [rows]="10"
      [totalRecords]="totalRecords()" 
      [loading]="loading()" 
      [rowsPerPageOptions]="[10, 25, 50]"
      styleClass="p-datatable-lg"
      [responsiveLayout]="'scroll'">
      
      <ng-template pTemplate="header">
        <tr class="bg-fundo-offwhite border-b-2 border-cinza-contorno">
          <th class="p-4 text-azul-prisma text-lg font-bold w-16">ID</th>
          <th class="p-4 text-azul-prisma text-lg font-bold">Nome</th>
          <th class="p-4 text-azul-prisma text-lg font-bold">Nome Social</th>
          <th class="p-4 text-azul-prisma text-lg font-bold text-center">CPF</th>
          <th class="p-4 text-azul-prisma text-lg font-bold text-center">Telefone</th>
          <th class="p-4 text-azul-prisma text-lg font-bold text-center w-24">Ações</th>
        </tr>
      </ng-template>

      <ng-template pTemplate="body" let-client>
        <tr class="border-b border-cinza-contorno hover:bg-gray-50 transition-colors">
          <td class="p-4 text-lg font-bold text-cinza-medio">#{{ client.id }}</td>
          <td class="p-4 text-lg font-medium">{{ client.name }}</td>
          <td class="p-4 text-lg italic text-cinza-medio">{{ client.socialName || '---' }}</td>
          <td class="p-4 text-center text-lg font-mono">{{ client.cpf }}</td>
          <td class="p-4 text-center text-lg">{{ client.phone }}</td>
          <td class="p-4 text-center">
            <button 
              [routerLink]="['/clients', client.id, 'edit']"
              class="bg-azul-prisma/10 hover:bg-azul-prisma hover:text-branco-puro text-azul-prisma p-3 rounded-full transition-all cursor-pointer shadow-sm"
              pTooltip="Editar Cliente">
              <i class="pi pi-pencil text-xl font-bold"></i>
            </button>
          </td>
        </tr>
      </ng-template>

      <ng-template pTemplate="emptymessage">
        <tr>
          <td colspan="6" class="p-12 text-center text-xl text-cinza-medio italic">Nenhum cliente encontrado.</td>
        </tr>
      </ng-template>
    </p-table>
  </div>
</div>
