<div class="p-6 w-full max-w-3xl mx-auto">
  <div class="bg-branco-puro rounded-2xl shadow-md border border-cinza-contorno p-4 md:p-8">

    <div class="mb-6 pb-4 border-b border-cinza-contorno">
      <h2 class="text-2xl md:text-3xl font-bold text-azul-prisma">Relatório de Atendimento Diário</h2>
      <p class="text-cinza-medio text-base md:text-lg mt-1">Preencha os filtros e gere o relatório em PDF.</p>
    </div>

    <div class="flex flex-col gap-5">

      <!-- Clínica -->
      <div class="flex flex-col gap-1">
        <label class="text-cinza-chumbo font-bold text-lg">Clínica</label>
        <div class="flex items-center gap-2">
          <input
            type="text"
            pInputText
            [ngModel]="clinicaNome()"
            readonly
            placeholder="Selecione uma clínica..."
            class="flex-1 border-2 border-cinza-contorno bg-fundo-offwhite rounded-lg text-lg px-4 py-3 outline-none" />
          <button
            type="button"
            pButton
            icon="pi pi-search"
            (click)="openClinicSearch()"
            class="bg-azul-prisma text-branco-puro rounded-lg px-4 py-3 hover:bg-opacity-90 transition-all cursor-pointer">
          </button>
          @if (clinicaId()) {
            <button
              type="button"
              pButton
              icon="pi pi-times"
              (click)="clearClinic()"
              class="p-button-danger rounded-lg px-4 py-3 transition-all cursor-pointer">
            </button>
          }
        </div>
      </div>

      <!-- Cliente -->
      <div class="flex flex-col gap-1">
        <label class="text-cinza-chumbo font-bold text-lg">Cliente</label>
        <div class="flex items-center gap-2">
          <input
            type="text"
            pInputText
            [ngModel]="clienteNome()"
            readonly
            placeholder="Selecione um cliente..."
            class="flex-1 border-2 border-cinza-contorno bg-fundo-offwhite rounded-lg text-lg px-4 py-3 outline-none" />
          <button
            type="button"
            pButton
            icon="pi pi-search"
            (click)="openClientSearch()"
            class="bg-azul-prisma text-branco-puro rounded-lg px-4 py-3 hover:bg-opacity-90 transition-all cursor-pointer">
          </button>
          @if (clienteId()) {
            <button
              type="button"
              pButton
              icon="pi pi-times"
              (click)="clearClient()"
              class="p-button-danger rounded-lg px-4 py-3 transition-all cursor-pointer">
            </button>
          }
        </div>
      </div>

      <!-- Usuário -->
      <div class="flex flex-col gap-1">
        <label class="text-cinza-chumbo font-bold text-lg">Usuário</label>
        <div class="flex items-center gap-2">
          <input
            type="text"
            pInputText
            [ngModel]="usuarioNome()"
            readonly
            placeholder="Selecione um usuário..."
            class="flex-1 border-2 border-cinza-contorno bg-fundo-offwhite rounded-lg text-lg px-4 py-3 outline-none" />
          <button
            type="button"
            pButton
            icon="pi pi-search"
            (click)="openUserSearch()"
            class="bg-azul-prisma text-branco-puro rounded-lg px-4 py-3 hover:bg-opacity-90 transition-all cursor-pointer">
          </button>
          @if (usuarioId()) {
            <button
              type="button"
              pButton
              icon="pi pi-times"
              (click)="clearUser()"
              class="p-button-danger rounded-lg px-4 py-3 transition-all cursor-pointer">
            </button>
          }
        </div>
      </div>

      <!-- Data de Emissão -->
      <div class="flex flex-col gap-1">
        <label class="text-cinza-chumbo font-bold text-lg">Data de Emissão</label>
        <p-datePicker
          [(ngModel)]="dataEmissao"
          dateFormat="dd/mm/yy"
          placeholder="Selecione a data de emissão"
          [showIcon]="true"
          styleClass="w-full"
          inputStyleClass="border-2 border-cinza-contorno rounded-lg text-lg px-4 py-3 w-full">
        </p-datePicker>
      </div>

      <!-- Status -->
      <div class="flex flex-col gap-1">
        <label class="text-cinza-chumbo font-bold text-lg">Status</label>
        <p-dropdown
          [options]="statusOptions"
          [(ngModel)]="status"
          optionLabel="label"
          optionValue="value"
          placeholder="Selecione o status"
          styleClass="w-full border-2 border-cinza-contorno rounded-lg">
        </p-dropdown>
      </div>

      <!-- Botão Imprimir -->
      <div class="flex justify-center pt-4">
        <button
          type="button"
          (click)="generate()"
          [disabled]="loading()"
          class="flex items-center gap-3 bg-azul-prisma hover:bg-blue-800 text-branco-puro font-bold rounded-xl px-8 py-4 text-xl transition-all cursor-pointer shadow-md disabled:opacity-50 disabled:cursor-not-allowed">
          @if (loading()) {
            <i class="pi pi-spinner pi-spin text-2xl"></i>
          } @else {
            <app-printer-icon [size]="32"></app-printer-icon>
          }
          <span>Gerar Relatório</span>
        </button>
      </div>

    </div>
  </div>
</div>
