<div class="p-6 w-full max-w-7xl mx-auto">
  <div class="bg-branco-puro rounded-2xl shadow-md border border-cinza-contorno p-6">
    
    <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-8">
      <div>
        <h2 class="text-3xl font-bold text-azul-prisma">Procedimentos Médicos</h2>
        <p class="text-cinza-medio text-lg">Gerencie os exames e consultas oferecidos pela clínica.</p>
      </div>
      <div class="flex flex-wrap gap-4 w-full md:w-auto">
        <button (click)="downloadProceduresExcel()"
          class="bg-azul-prisma hover:bg-blue-800 text-branco-puro px-5 py-3 rounded-lg font-bold transition-colors flex items-center gap-2 cursor-pointer shadow-sm text-base">
          <i class="pi pi-download font-bold"></i>
          Baixar XLSX
        </button>
        <input type="file" #fileImportInput accept=".xlsx, .xls" class="hidden" (change)="importProcedures($event)" />
        <button (click)="fileImportInput.click()"
          class="bg-verde-teal hover:bg-teal-700 text-branco-puro px-5 py-3 rounded-lg font-bold transition-colors flex items-center gap-2 cursor-pointer shadow-sm text-base">
          <i class="pi pi-upload font-bold"></i>
          Importar XLSX
        </button>
        <button routerLink="/procedures/new"
          class="bg-azul-prisma hover:bg-blue-800 text-branco-puro px-5 py-3 rounded-lg font-bold transition-colors flex items-center gap-2 cursor-pointer shadow-sm text-base">
          <i class="pi pi-plus font-bold"></i>
          Novo Procedimento
        </button>
      </div>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8 p-6 bg-fundo-offwhite rounded-xl border border-cinza-contorno items-end">
      
      <p-floatlabel>
        <input id="nameFilter" type="text" pInputText [(ngModel)]="filterName" (keyup.enter)="onFilter()"
          class="w-full border-2 border-cinza-contorno bg-branco-puro text-lg py-3 px-4 rounded-lg focus:border-verde-teal outline-none transition-all" />
        <label for="nameFilter" class="ml-2 text-cinza-chumbo font-medium">Nome do Procedimento</label>
      </p-floatlabel>

      <div class="flex flex-col gap-1">
        <label for="typeFilter" class="ml-1 text-cinza-chumbo font-bold text-base">Filtrar por Tipo</label>
        <p-dropdown 
          id="typeFilter" 
          [options]="typeOptions" 
          [(ngModel)]="filterType" 
          optionLabel="label"
          optionValue="value" 
          (onChange)="onFilter()"
          styleClass="w-full border-2 border-cinza-contorno bg-branco-puro text-lg rounded-lg h-[58px] flex items-center px-2">
        </p-dropdown>
      </div>

      <button (click)="onFilter()"
        class="bg-verde-teal hover:bg-teal-700 text-branco-puro rounded-lg font-bold text-lg h-[58px] flex items-center justify-center gap-2 transition-all cursor-pointer shadow-sm">
        <i class="pi pi-search font-bold"></i>
        Pesquisar
      </button>
    </div>

    <p-table 
      [value]="procedures()" 
      [lazy]="true" 
      (onLazyLoad)="loadProcedures($event)"
      [paginator]="true" 
      [rows]="10" 
      [totalRecords]="totalRecords()" 
      [loading]="loading()"
      [rowsPerPageOptions]="[10, 25, 50]"
      styleClass="p-datatable-lg custom-table"
      [responsiveLayout]="'scroll'">
      
      <ng-template pTemplate="header">
        <tr class="bg-fundo-offwhite border-b-2 border-cinza-contorno">
          <th class="p-4 text-azul-prisma font-bold text-lg text-center w-[10%]">ID</th>
          <th class="p-4 text-azul-prisma font-bold text-lg">Nome</th>
          <th class="p-4 text-azul-prisma font-bold text-lg text-center w-[15%]">Tag</th>
          <th class="p-4 text-azul-prisma font-bold text-lg text-center w-[15%]">Tipo</th>
          <th class="p-4 text-azul-prisma font-bold text-lg text-center w-[15%]">Ativo</th>
          <th class="p-4 text-azul-prisma font-bold text-lg text-center w-[15%]">Ações</th>
        </tr>
      </ng-template>

      <ng-template pTemplate="body" let-proc>
        <tr [ngClass]="{'text-vermelho-alerta font-bold italic': !proc.active}" class="border-b border-cinza-contorno hover:bg-gray-50 transition-colors">
          <td class="p-4 text-center text-lg">{{ proc.id }}</td>
          <td class="p-4 text-lg">{{ proc.name }}</td>
          <td class="p-4 text-center text-lg">
            <span class="px-2.5 py-1 rounded-md text-sm font-semibold bg-gray-100 text-cinza-chumbo border border-gray-200">
              {{ proc.tag || '-' }}
            </span>
          </td>
          <td class="p-4 text-center text-lg">
            <span class="px-3 py-1 rounded-full text-sm font-bold border transition-colors" 
                  [ngClass]="proc.type === 'EXAME' 
                            ? 'bg-blue-50 text-blue-800 border-blue-100' 
                            : 'bg-teal-50 text-teal-800 border-teal-100'">
              {{ proc.type }}
            </span>
          </td>
          <td class="p-4 text-center text-lg">
            {{ proc.active ? 'Sim' : 'Não' }}
          </td>
          <td class="p-4 text-center">
            <button 
              [routerLink]="['/procedures', proc.id, 'edit']"
              class="bg-azul-prisma/10 hover:bg-azul-prisma hover:text-branco-puro text-azul-prisma p-3 rounded-full transition-all cursor-pointer shadow-sm"
              pTooltip="Editar Procedimento">
              <i class="pi pi-pencil text-xl"></i>
            </button>
          </td>
        </tr>
      </ng-template>

      <ng-template pTemplate="emptymessage">
        <tr>
          <td colspan="6" class="p-8 text-center text-xl text-cinza-medio font-medium">
            Nenhum procedimento encontrado com os filtros selecionados.
          </td>
        </tr>
      </ng-template>
    </p-table>
  </div>
</div>
