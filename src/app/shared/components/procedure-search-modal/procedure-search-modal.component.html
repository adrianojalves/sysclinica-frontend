<div class="flex flex-col gap-4">
  <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
    <div class="p-inputgroup">
      <input 
        type="text" 
        pInputText 
        placeholder="Pesquisar por nome..." 
        [(ngModel)]="filter.name"
        (keyup.enter)="search()"
        class="w-full border-2 border-cinza-contorno" />
    </div>
    
    <div class="flex gap-2">
      <p-dropdown 
        [options]="typeOptions" 
        [(ngModel)]="filter.type"
        placeholder="Tipo"
        class="w-full border-2 border-cinza-contorno "
        (onChange)="search()">
      </p-dropdown>
      <button 
        pButton 
        icon="pi pi-search" 
        (click)="search()"
        class="bg-azul-prisma px-6 text-branco-puro">
      </button>
    </div>
  </div>

  <p-table 
    [value]="procedures()" 
    [loading]="loading()" 
    [paginator]="true" 
    [rows]="5"
    responsiveLayout="scroll"
    styleClass="p-datatable-sm p-datatable-striped border border-cinza-contorno rounded-lg">
    
    <ng-template pTemplate="header">
      <tr class="bg-fundo-offwhite">
        <th class="text-azul-prisma font-bold py-3 px-4">Procedimento</th>
        <th class="text-azul-prisma font-bold py-3 px-4">Tipo</th>
        <th style="width: 80px"></th>
      </tr>
    </ng-template>

    <ng-template pTemplate="body" let-proc>
      <tr class="hover:bg-gray-50 transition-colors">
        <td class="font-medium py-3 px-4 text-cinza-chumbo">{{ proc.name }}</td>
        <td class="py-3 px-4">
          <span class="px-2 py-1 rounded-md text-sm font-bold bg-gray-100 text-cinza-medio">
            {{ proc.type }}
          </span>
        </td>
        <td class="py-3 px-4 text-center">
          <button 
            pButton 
            icon="pi pi-check" 
            class="p-button-rounded p-button-text p-button-success" 
            (click)="selectProcedure(proc)"
            pTooltip="Selecionar">
          </button>
        </td>
      </tr>
    </ng-template>

    <ng-template pTemplate="emptymessage">
      <tr>
        <td colspan="3" class="text-center p-8 text-cinza-medio italic">
          Nenhum procedimento ativo encontrado.
        </td>
      </tr>
    </ng-template>
  </p-table>
</div>
